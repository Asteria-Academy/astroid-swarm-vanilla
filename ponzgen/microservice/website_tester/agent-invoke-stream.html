<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ponzgen Stream Interface</title>
    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <!-- CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <link href="css/styles.css" rel="stylesheet">
</head>

<body>

    <div class="app-layout">
        <!-- Sidebar Configuration Panel -->
        <aside class="sidebar-panel" id="sidebarPanel">
            <div class="sidebar-header d-flex align-items-center justify-content-between">
                <div class="d-flex align-items-center gap-2">
                    <div class="icon-box bg-primary-soft text-primary"
                        style="width: 32px; height: 32px; font-size: 1rem;">
                        <i class="bi bi-robot"></i>
                    </div>
                    <span class="fw-bold tracking-wide text-sm">Inference Config</span>
                </div>
                <!-- Back to Home -->
                <a href="index.html" class="btn btn-sm btn-light-soft text-muted boarder-0" title="Back to Home">
                    <i class="bi bi-house"></i>
                </a>
            </div>

            <div class="sidebar-content">
                <!-- Agent Selection -->
                <div class="mb-4">
                    <label class="text-xs fw-bold text-uppercase text-muted mb-2">Target Agent</label>
                    <select class="form-select form-control" id="agent-select">
                        <option value="">Loading agents...</option>
                    </select>
                    <button id="get-agent-info" class="btn btn-sm btn-outline-secondary w-100 mt-2">
                        <i class="bi bi-info-circle me-1"></i> View Details
                    </button>
                    <div id="agent-info-container" class="mt-2 text-xs text-muted"></div>
                </div>

                <!-- Session Settings -->
                <div class="mb-4">
                    <label class="text-xs fw-bold text-uppercase text-muted mb-2">Session Control</label>

                    <div class="mb-3">
                        <label class="form-label text-xs">Thread ID</label>
                        <div class="input-group">
                            <span class="input-group-text bg-light border-end-0"><i class="bi bi-hash"></i></span>
                            <input type="text" class="form-control bg-light border-start-0 ps-0" id="thread-id"
                                value="1">
                        </div>
                    </div>

                    <div class="mb-3">
                        <select class="form-select form-control" id="model-name">
                            <option value="">Auto-Detect</option>
                        </select>
                    </div>

                    <!-- Chat Recommendation Toggle -->
                    <div class="form-check form-switch mb-3">
                        <input class="form-check-input" type="checkbox" id="chat-recommendation-toggle" checked>
                        <label class="form-check-label text-sm" for="chat-recommendation-toggle">
                            Smart Suggestions
                            <i class="bi bi-stars text-warning ms-1" title="Auto-generate reply suggestions"></i>
                        </label>
                    </div>

                    <div class="form-check form-switch mb-2">
                        <input class="form-check-input" type="checkbox" id="reset-memory">
                        <label class="form-check-label text-sm" for="reset-memory">Reset Memory</label>
                    </div>

                    <div class="form-check form-switch">
                        <input class="form-check-input" type="checkbox" id="load-from-json" checked>
                        <label class="form-check-label text-sm" for="load-from-json">Load Context (JSON)</label>
                    </div>
                </div>

                <!-- Advanced context -->
                <div class="mb-3">
                    <label class="text-xs fw-bold text-uppercase text-muted mb-2">System Context</label>
                    <textarea class="form-control bg-light" id="agent-context" rows="3"
                        placeholder="Inject temporary system prompt..."></textarea>
                </div>

                <!-- Agent Style -->
                <div class="mb-3">
                    <label class="text-xs fw-bold text-uppercase text-muted mb-2">Persona Style</label>
                    <input type="text" class="form-control bg-light" id="agent-style"
                        placeholder="e.g. piratical, formal">
                </div>
            </div>

            <div class="sidebar-footer">
                <button id="update-settings" class="btn btn-dark w-100 shadow-sm">
                    <i class="bi bi-check2-circle me-1"></i> Apply Configuration
                </button>
            </div>
        </aside>

        <!-- Main Chat Area -->
        <main class="chat-area">
            <!-- Glass Header -->
            <header class="chat-header">
                <div class="d-flex align-items-center">
                    <button class="btn btn-outline-secondary d-md-none me-2" id="toggleSidebar">
                        <i class="bi bi-list"></i>
                    </button>
                    <div>
                        <h5 class="mb-0 fw-bold text-dark">Live Inference</h5>
                        <div class="d-flex align-items-center gap-2">
                            <span class="badge bg-success-soft text-success rounded-pill px-2 py-0.5"
                                style="font-size: 0.7rem;">
                                <span class="spinner-grow spinner-grow-sm me-1" role="status"
                                    style="width: 0.4rem; height: 0.4rem; animation-duration: 1.5s;"></span>
                                Stream Active
                            </span>
                            <span id="current-status" class="text-xs text-muted">Ready</span>
                        </div>
                    </div>
                </div>

                <button id="clear-response" class="btn btn-outline-danger btn-sm rounded-pill px-3">
                    <i class="bi bi-trash3 me-1"></i> Clear Chat
                </button>
            </header>

            <!-- Chat Messages (Scrollable) -->
            <div id="chat-container" class="chat-messages d-flex flex-column p-4">
                <!-- Welcome Message -->
                <div class="d-flex flex-column align-items-center justify-content-center h-100 opacity-50">
                    <div class="icon-box bg-light text-muted mb-3 rounded-circle" style="width: 64px; height: 64px;">
                        <i class="bi bi-chat-square-dots fs-3"></i>
                    </div>
                    <p class="text-muted">Select an agent and start the conversation.</p>
                </div>
            </div>

            <!-- Tool Status Overlay (Floating) -->
            <div id="tool-status-container" class="position-absolute top-0 end-0 m-3"
                style="width: 300px; max-height: 200px; overflow-y: auto; z-index: 20; pointer-events: none;">
                <!-- Tool statuses will appear here as toasts -->
            </div>

            <!-- Input Area -->
            <div class="chat-input-wrapper">
                <!-- Recommendations Chips -->
                <div id="recommendation-chips-container" class="d-flex flex-wrap gap-2 mb-2 px-2"
                    style="display: none !important;">
                    <!-- Chips will be injected here -->
                </div>

                <!-- Image Preview -->
                <div id="image-preview"
                    class="position-absolute bottom-100 start-0 mb-2 ms-4 p-2 bg-white rounded shadow-sm border"
                    style="display: none; z-index: 10;">
                    <div class="position-relative">
                        <img id="preview-image" src="#" alt="Preview"
                            style="height: 80px; width: auto; border-radius: 8px;">
                        <button id="remove-image"
                            class="btn btn-danger btn-sm p-0 rounded-circle position-absolute top-0 end-0 translate-middle"
                            style="width: 20px; height: 20px;">
                            <i class="bi bi-x"></i>
                        </button>
                    </div>
                </div>

                <div class="d-flex gap-3 align-items-center">
                    <div class="input-capsule flex-grow-1">
                        <!-- Image Upload Button -->
                        <label
                            class="btn btn-light-soft text-secondary rounded-circle p-0 d-flex align-items-center justify-content-center me-2"
                            style="width: 32px; height: 32px; cursor: pointer;" title="Upload Image">
                            <i class="bi bi-image"></i>
                            <input type="file" id="image-upload" accept="image/*" style="display: none;">
                        </label>

                        <input type="text" id="agent-message" class="chat-input-field"
                            placeholder="Type a message to agent..." autocomplete="off">
                    </div>

                    <button id="invoke-agent" class="send-btn-circle shadow-lg hover-scale">
                        <i class="bi bi-send-fill" style="margin-left: 2px;"></i>
                    </button>
                </div>
                <div class="text-center mt-2">
                    <small class="text-xs text-muted opacity-75">Press Enter to send • Supports Multimodal
                        Inputs</small>
                </div>
            </div>
        </main>
    </div>

    <!-- Notification Container -->
    <div id="notification-container" class="position-fixed bottom-0 end-0 p-3" style="z-index: 1050"></div>

    <!-- Scripts -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <script src="js/main.js"></script>
    <script src="js/agent-invoke-stream.js"></script>
    <script>
        // Sidebar Toggle for Mobile
        const toggleBtn = document.getElementById('toggleSidebar');
        const sidebar = document.getElementById('sidebarPanel');
        if (toggleBtn) {
            toggleBtn.addEventListener('click', () => {
                sidebar.classList.toggle('show');
            });
        }
    </script>
</body>

</html>
