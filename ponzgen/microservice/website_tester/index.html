<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ponzgen Swarm Intelligence</title>
    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&display=swap"
        rel="stylesheet">
    <!-- Custom CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <style>
        :root {
            --bg-dark: #050505;
            --panel-bg: rgba(20, 20, 20, 0.8);
            --text-primary: #ffffff;
            --text-secondary: #a0a0a0;

            /* CMY Palette */
            --c-cyan: #00FFFF;
            --c-magenta: #FF00FF;
            --c-yellow: #FFFF00;
        }

        body {
            background-color: var(--bg-dark);
            color: var(--text-primary);
            font-family: 'Space Grotesk', sans-serif;
            height: 100vh;
            overflow: hidden;
            /* Prevent scrolling for the full-screen layout */
            margin: 0;
        }

        .split-layout {
            display: flex;
            height: 100vh;
        }

        /* LEFT SIDE: Features */
        .features-panel {
            width: 40%;
            background: var(--panel-bg);
            backdrop-filter: blur(20px);
            padding: 3rem;
            display: flex;
            flex-direction: column;
            justify-content: center;
            border-right: 1px solid rgba(255, 255, 255, 0.1);
            position: relative;
            z-index: 10;
        }

        /* RIGHT SIDE: Visuals */
        .visuals-panel {
            width: 60%;
            position: relative;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        #canvas-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
        }

        .overlay-text {
            position: relative;
            z-index: 2;
            text-align: right;
            pointer-events: none;
            /* Let clicks pass through to canvas if needed */
            padding-right: 4rem;
            width: 100%;
        }

        h1.swarm-title {
            font-size: 5rem;
            line-height: 1;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: -2px;
            margin-bottom: 1rem;
            /* CMY Gradient Text */
            background: linear-gradient(to right, var(--c-cyan), var(--c-magenta), var(--c-yellow));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: 0 0 30px rgba(255, 0, 255, 0.3);
        }

        p.swarm-subtitle {
            font-size: 1.5rem;
            color: var(--text-secondary);
            font-weight: 300;
            letter-spacing: 2px;
        }

        /* CARDS */
        .feature-card {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.05);
            padding: 1.5rem;
            margin-bottom: 1.5rem;
            border-radius: 12px;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            display: flex;
            align-items: center;
            text-decoration: none;
            color: var(--text-primary);
            position: relative;
            overflow: hidden;
        }

        /* Cyan Glow on Hover */
        .feature-card:hover {
            transform: translateX(10px);
            background: rgba(0, 255, 255, 0.05);
            border-color: var(--c-cyan);
            box-shadow: 0 0 20px rgba(0, 255, 255, 0.1);
        }

        .feature-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 3px;
            height: 100%;
            background: var(--c-magenta);
            transform: scaleY(0);
            transition: transform 0.3s;
        }

        .feature-card:hover::before {
            transform: scaleY(1);
        }

        .feature-icon {
            font-size: 2rem;
            margin-right: 1.5rem;
            width: 50px;
            height: 50px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 8px;
            background: rgba(0, 0, 0, 0.3);
            /* Icon Colors cyclically */
        }

        /* Specific Card Accents */
        .card-agents .feature-icon {
            color: var(--c-cyan);
            border: 1px solid rgba(0, 255, 255, 0.3);
        }

        .card-tools .feature-icon {
            color: var(--c-magenta);
            border: 1px solid rgba(255, 0, 255, 0.3);
        }

        .card-creator .feature-icon {
            color: var(--c-yellow);
            border: 1px solid rgba(255, 255, 0, 0.3);
        }

        .card-stream .feature-icon {
            color: #fff;
            border: 1px solid rgba(255, 255, 255, 0.3);
        }

        .feature-info h3 {
            font-size: 1.25rem;
            margin: 0;
            font-weight: 600;
            letter-spacing: 0.5px;
        }

        .feature-info p {
            margin: 0;
            font-size: 0.85rem;
            color: var(--text-secondary);
        }

        /* Config Button */
        .config-trigger {
            position: absolute;
            bottom: 2rem;
            left: 3rem;
            color: var(--text-secondary);
            text-decoration: none;
            font-size: 0.9rem;
            display: flex;
            align-items: center;
            transition: color 0.3s;
            background: none;
            border: none;
            padding: 0;
        }

        .config-trigger:hover {
            color: var(--c-cyan);
        }

        /* Configuration Modal (minimalist) */
        .config-modal {
            position: fixed;
            bottom: 5rem;
            left: 3rem;
            width: 300px;
            background: rgba(10, 10, 10, 0.95);
            border: 1px solid var(--c-magenta);
            border-radius: 12px;
            padding: 1.5rem;
            z-index: 100;
            display: none;
            box-shadow: 0 0 30px rgba(255, 0, 255, 0.2);
        }

        .config-modal.show {
            display: block;
            animation: slideUp 0.3s ease-out;
        }

        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(20px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .form-control-tech {
            background: rgba(0, 0, 0, 0.5);
            border: 1px solid #333;
            color: #fff;
            font-family: monospace;
            font-size: 0.9rem;
        }

        .form-control-tech:focus {
            background: #000;
            border-color: var(--c-cyan);
            color: #fff;
            box-shadow: none;
        }

        .btn-tech {
            background: transparent;
            border: 1px solid var(--c-cyan);
            color: var(--c-cyan);
            text-transform: uppercase;
            letter-spacing: 1px;
            font-size: 0.8rem;
            padding: 0.5rem 1rem;
            width: 100%;
            margin-top: 1rem;
            transition: all 0.3s;
        }

        .btn-tech:hover {
            background: var(--c-cyan);
            color: #000;
            box-shadow: 0 0 15px var(--c-cyan);
        }
    </style>
</head>

<body>

    <div class="split-layout">
        <!-- LEFT: Features -->
        <div class="features-panel">
            <div class="mb-5">
                <span class="badge rounded-pill border border-light text-light px-3 py-1 mb-3"
                    style="font-weight: 300; letter-spacing: 1px;">V 2.0.0</span>
                <h2 class="text-white fw-light">Select Module</h2>
            </div>

            <div class="feature-list">
                <a href="agents.html" class="feature-card card-agents">
                    <div class="feature-icon"><i class="bi bi-robot"></i></div>
                    <div class="feature-info">
                        <h3>Agents</h3>
                        <p>Orchestrate autonomous units</p>
                    </div>
                </a>

                <a href="tools.html" class="feature-card card-tools">
                    <div class="feature-icon"><i class="bi bi-tools"></i></div>
                    <div class="feature-info">
                        <h3>Tools</h3>
                        <p>Function calling & capabilities</p>
                    </div>
                </a>

                <a href="agent-creator.html" class="feature-card card-creator">
                    <div class="feature-icon"><i class="bi bi-stars"></i></div>
                    <div class="feature-info">
                        <h3>Agent Creator</h3>
                        <p>Natural language generation</p>
                    </div>
                </a>

                <a href="agent-invoke-stream.html" class="feature-card card-stream">
                    <div class="feature-icon"><i class="bi bi-terminal"></i></div>
                    <div class="feature-info">
                        <h3>Stream Invoke</h3>
                        <p>Real-time debugger</p>
                    </div>
                </a>
            </div>

            <button class="config-trigger" id="config-toggle">
                <i class="bi bi-gear-fill me-2"></i> SYSTEM CONFIG
            </button>

            <!-- Config Modal -->
            <div class="config-modal" id="config-panel">
                <h6 class="text-uppercase text-muted mb-3" style="letter-spacing: 2px; font-size: 0.7rem;">Connection
                    Settings</h6>
                <div class="mb-3">
                    <label class="form-label small text-secondary">JWT Token</label>
                    <input type="text" class="form-control form-control-tech" id="jwt-token" placeholder="Bearer Token">
                </div>
                <div class="mb-3">
                    <label class="form-label small text-secondary">API URL</label>
                    <input type="text" class="form-control form-control-tech" id="api-url"
                        value="http://localhost:8000">
                </div>
                <div class="d-flex justify-content-between align-items-center">
                    <span class="badge bg-transparent border border-secondary text-secondary"
                        id="auth-status">OFFLINE</span>
                    <button id="save-auth" class="btn-tech" style="width: auto;">CONNECT</button>
                </div>
            </div>
        </div>

        <!-- RIGHT: Visuals -->
        <div class="visuals-panel">
            <div id="canvas-container"></div>
            <div class="overlay-text">
                <h1 class="swarm-title">PONZGEN<br>SWARM<br>INTEL</h1>
                <p class="swarm-subtitle">AUTONOMOUS MULTI-AGENT SYSTEM</p>
            </div>
        </div>
    </div>

    <!-- Scripts -->
    <!-- Three.js CDN -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r134/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/js/bootstrap.bundle.min.js"></script>

    <script>
        // --- AUTH LOGIC ---
        document.addEventListener('DOMContentLoaded', function () {
            // Load saved auth data
            const jwtToken = localStorage.getItem('jwt_token');
            const apiUrl = localStorage.getItem('api_url');

            if (jwtToken) document.getElementById('jwt-token').value = jwtToken;
            if (apiUrl) document.getElementById('api-url').value = apiUrl;

            updateAuthStatus();

            document.getElementById('save-auth').addEventListener('click', function () {
                localStorage.setItem('jwt_token', document.getElementById('jwt-token').value);
                localStorage.setItem('api_url', document.getElementById('api-url').value);
                updateAuthStatus();

                // Tech effect
                this.innerHTML = "LINKED";
                this.style.borderColor = "var(--c-magenta)";
                this.style.color = "var(--c-magenta)";
                setTimeout(() => {
                    this.innerHTML = "CONNECT";
                    this.style.borderColor = "var(--c-cyan)";
                    this.style.color = "var(--c-cyan)";
                }, 2000);
            });

            // Toggle Config
            document.getElementById('config-toggle').addEventListener('click', function () {
                document.getElementById('config-panel').classList.toggle('show');
            });
        });

        function updateAuthStatus() {
            const jwtToken = localStorage.getItem('jwt_token');
            const badge = document.getElementById('auth-status');
            if (jwtToken) {
                badge.textContent = "ONLINE";
                badge.classList.remove('border-secondary', 'text-secondary');
                badge.classList.add('border-info', 'text-info');
                badge.style.borderColor = "var(--c-cyan)";
                badge.style.color = "var(--c-cyan)";
            }
        }

        // --- THREE.JS ANIMATION (ROBOTIC SWARM) ---
        const initThree = () => {
            const container = document.getElementById('canvas-container');
            const scene = new THREE.Scene();
            // Fog for depth
            scene.fog = new THREE.FogExp2(0x050505, 0.002);

            const camera = new THREE.PerspectiveCamera(75, container.clientWidth / container.clientHeight, 0.1, 1000);
            camera.position.z = 50;

            const renderer = new THREE.WebGLRenderer({ alpha: true, antialias: true });
            renderer.setSize(container.clientWidth, container.clientHeight);
            renderer.setPixelRatio(window.devicePixelRatio);
            container.appendChild(renderer.domElement);

            // GEOMETRY: Icosahedron Swarm
            const geometry = new THREE.IcosahedronGeometry(10, 2);
            const wireframe = new THREE.WireframeGeometry(geometry);

            // MATERIAL: Cyan tech lines
            const lineMaterial = new THREE.LineBasicMaterial({ color: 0x00FFFF, transparent: true, opacity: 0.3 });
            const sphere = new THREE.LineSegments(wireframe, lineMaterial);
            scene.add(sphere);

            // PARTICLES SWARM
            const particlesGeometry = new THREE.BufferGeometry();
            const particlesCount = 700;
            const posArray = new Float32Array(particlesCount * 3);
            const colorsArray = new Float32Array(particlesCount * 3);

            const colorPalette = [
                new THREE.Color(0x00FFFF), // Cyan
                new THREE.Color(0xFF00FF), // Magenta
                new THREE.Color(0xFFFF00)  // Yellow
            ];

            for (let i = 0; i < particlesCount * 3; i += 3) {
                // Random spread
                posArray[i] = (Math.random() - 0.5) * 100;
                posArray[i + 1] = (Math.random() - 0.5) * 100;
                posArray[i + 2] = (Math.random() - 0.5) * 100;

                // Random color from palette
                const color = colorPalette[Math.floor(Math.random() * colorPalette.length)];
                colorsArray[i] = color.r;
                colorsArray[i + 1] = color.g;
                colorsArray[i + 2] = color.b;
            }

            particlesGeometry.setAttribute('position', new THREE.BufferAttribute(posArray, 3));
            particlesGeometry.setAttribute('color', new THREE.BufferAttribute(colorsArray, 3));

            const particlesMaterial = new THREE.PointsMaterial({
                size: 0.5,
                vertexColors: true,
                transparent: true,
                opacity: 0.8,
                blending: THREE.AdditiveBlending
            });

            const particlesMesh = new THREE.Points(particlesGeometry, particlesMaterial);
            scene.add(particlesMesh);

            // CORE: Glowing Magenta Center
            const coreGeo = new THREE.SphereGeometry(2, 32, 32);
            const coreMat = new THREE.MeshBasicMaterial({ color: 0xFF00FF, wireframe: true });
            const core = new THREE.Mesh(coreGeo, coreMat);
            scene.add(core);

            // ANIMATION LOOP
            let mouseX = 0;
            let mouseY = 0;

            document.addEventListener('mousemove', (event) => {
                mouseX = event.clientX / window.innerWidth - 0.5;
                mouseY = event.clientY / window.innerHeight - 0.5;
            });

            const animate = () => {
                requestAnimationFrame(animate);

                // Rotate Sphere
                sphere.rotation.x += 0.001;
                sphere.rotation.y += 0.002;

                // Expand/Contract Sphere "Breathing"
                const time = Date.now() * 0.001;
                const scale = 1 + Math.sin(time) * 0.1;
                sphere.scale.set(scale, scale, scale);

                // Move Particles "Swarm" style
                particlesMesh.rotation.y = -mouseX * 0.5;
                particlesMesh.rotation.x = -mouseY * 0.5;
                particlesMesh.rotation.z += 0.0005;

                // Core Rotation
                core.rotation.x -= 0.01;
                core.rotation.y -= 0.01;

                renderer.render(scene, camera);
            };

            animate();

            // Resize Handler
            window.addEventListener('resize', () => {
                const width = container.clientWidth;
                const height = container.clientHeight;
                renderer.setSize(width, height);
                camera.aspect = width / height;
                camera.updateProjectionMatrix();
            });
        };

        initThree();
    </script>
</body>

</html>
